# Comprobación completa en cada push y PR: tipos, lint, tests y trazabilidad spec → test (npm run check).
name: check

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # Windows y Linux son las plataformas del producto; un test solo corre en Windows.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Sin scripts de instalación: los tests no necesitan el binario de Electron ni compilar node-pty.
      - run: npm ci --ignore-scripts
      - run: npm run check
